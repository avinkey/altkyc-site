<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AltKYC Intro</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
    }

    #videoContainer {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 999;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #mainContent {
      display: none;
      background: #111;
      color: white;
      padding: 3rem;
      text-align: center;
      font-family: sans-serif;
    }

    h1 {
      margin-bottom: 20px;
    }

    a.button {
      display: block;
      margin: 15px auto;
      width: 200px;
      padding: 12px;
      background-color: limegreen;
      color: black;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: background 0.3s;
    }

    a.button:hover {
      background-color: #00cc00;
    }
  </style>
</head>
<body>

  <div id="videoContainer">
    <video id="introVideo" autoplay muted playsinline>
      <source src="altkyc.mp4" type="video/mp4">
    </video>
  </div>

  <div id="mainContent">
    <h1>👁 Welcome to AltKYC</h1>
    <p>The decentralized KYC & KYB gray market.</p>
    <a class="button" href="buyer.html">👤 Enter as Buyer</a>
    <a class="button" href="seller.html">💼 Enter as Seller</a>
    <a class="button" href="learn.html">🧠 Learn</a>
  </div>

  <script>
    const video = document.getElementById("introVideo");
    video.onended = () => {
      document.getElementById("videoContainer").style.display = "none";
      document.getElementById("mainContent").style.display = "block";
    };
  </script>

</body>
</html>
